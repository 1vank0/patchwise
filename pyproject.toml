[project]
name = "patchwise"
version = "0.1.0"
description = "Reachability-aware dependency vulnerability triage and verified fixes, powered by NVIDIA Nemotron on Nebius Token Factory"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "httpx>=0.27", "packaging>=23", "jinja2>=3.1", "cvss>=3.1",
                "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
patchwise = "patchwise.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["patchwise"]

[tool.setuptools.package-data]
patchwise = ["assets/*", "replay/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs uv installs + the demo test suite"]
